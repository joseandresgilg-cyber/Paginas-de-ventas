
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera página de ventas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }
    main {
      max-width: 700px;
      margin: 80px auto;
      padding: 35px 20px;
      background: white;
      border-radius: 16px;
    }
    h1 { color: #222; }
    p { line-height: 1.7; }
    a {
      display: inline-block;
      padding: 15px 25px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>¡Bienvenido a mi página!</h1>
    <p>Esta es mi primera página web alojada en Cloudflare.</p>
    <p>Pronto encontrarás aquí mis productos y ofertas.</p>
    <a href="#productos">Conocer más</a>
  </main>
</body>
</html>
